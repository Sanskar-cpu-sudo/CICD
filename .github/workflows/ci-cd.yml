name: Student Placement CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  placement-pipeline:

    name: Student Placement Pipeline

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Get source code
      # --------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Install Python
      # --------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # --------------------------------
      # 3. Install dependencies
      # --------------------------------

      - name: Install dependencies
        run: pip install -r requirements.txt


      # --------------------------------
      # 4. Code quality / syntax check
      # --------------------------------

      - name: Code quality check
        run: python -m compileall -q app.py src tests


      # --------------------------------
      # 5. Validate dataset
      # --------------------------------

      - name: Validate data
        run: python src/validate_data.py


      # --------------------------------
      # 6. Train model
      # --------------------------------

      - name: Train model
        run: python -m src.train


      # --------------------------------
      # 7. Check model exists
      # --------------------------------

      - name: Check model file
        run: test -f model.pkl


      # --------------------------------
      # 8. Evaluate model
      # --------------------------------

      - name: Evaluate model
        run: python -m src.evaluate


      # --------------------------------
      # 9. Run unit + API tests
      # --------------------------------

      - name: Run tests
        run: python -m pytest -q