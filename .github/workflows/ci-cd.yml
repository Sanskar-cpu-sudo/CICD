name: Student Placement CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  code-quality:

    name: Code Quality

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .


  data-validation:

    name: Data Validation

    runs-on: ubuntu-latest

    needs: code-quality

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data
        run: python src/validate_data.py


  train-and-evaluate:

    name: Train and Evaluate Model

    runs-on: ubuntu-latest

    needs: data-validation

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python -m src.train

      - name: Check model file
        run: test -f model.pkl

      - name: Evaluate model
        run: python -m src.evaluate


  tests:

    name: Run Tests

    runs-on: ubuntu-latest

    needs: train-and-evaluate

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python -m src.train

      - name: Run pytest
        run: python -m pytest -q